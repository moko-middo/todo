name: Deploy to GitHub Pages

# どのブランチへの push でも、content/podcasts/ の未処理の音声を文字起こし・和訳してそのブランチにコミットする。
# master のときはその後サイトをビルドして GitHub Pages に公開する。
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transcribe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # 連続でアップロードされても、文字起こしは 1 本ずつ順番に（後の実行は前の結果を取り込んでから始める）
    concurrency:
      group: transcribe-${{ github.ref }}
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      WHISPER_MODEL: ${{ vars.WHISPER_MODEL || 'small.en' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - id: check
        run: echo "pending=$(python3 scripts/transcribe.py --check)" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.pending != '0'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - if: steps.check.outputs.pending != '0'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ env.WHISPER_MODEL }}
      - if: steps.check.outputs.pending != '0'
        run: pip install -r scripts/requirements.txt
      - if: steps.check.outputs.pending != '0'
        run: python3 scripts/transcribe.py
      # 一部が失敗しても、できた分はコミットする
      - if: always() && steps.check.outputs.pending != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A content/podcasts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: ポッドキャストの文字起こし・和訳を追加"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

  build:
    needs: transcribe
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }} # 文字起こしジョブのコミットを含む最新を取る
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE_PATH: /todo/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
